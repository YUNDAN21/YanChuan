[project]
name = "livecaptions-meetings"
version = "0.1.0"
description = "Composable persistent meeting transcription and periodic AI summary APIs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
